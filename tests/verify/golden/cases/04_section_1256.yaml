  # SPX call: 1 contract × $100/share × 100 multiplier = $10,000 cost.
  - date: 2025-03-01
    action: Buy
    ticker: SPX
    qty: 1
    cost_basis: 10000.00
    account: Schwab/Taxable
    option:
      strike: 5000
      expiry: 2025-12-19
